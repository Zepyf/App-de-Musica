; Configuración de las herramientas de Zepyfy.
;
; Copia este archivo como "config.ini" en esta misma carpeta y rellena los valores.
; config.ini está en .gitignore: nunca se sube al repositorio.
; Cada valor también se puede dar con la variable de entorno indicada.

[zepyfy]

; Carpeta de tu biblioteca. Dentro debe haber una subcarpeta "Cancion" con los MP3;
; los scripts crean "Letras", "Portadas" y "Artistas" a su lado.
; Ejemplo Windows: C:\Users\TuUsuario\Music\Zepyfy
; Ejemplo Linux/macOS: ~/Music/Zepyfy
; (variable de entorno: ZEPYFY_LIBRARY_DIR)
library_dir =

; Token de acceso de la API de Genius (para letras, portadas y fotos de artistas).
; Se crea en https://genius.com/api-clients -> "Generate Access Token".
; (variable de entorno: GENIUS_TOKEN)
genius_token =

; Ruta al archivo JSON de la cuenta de servicio de Firebase (solo para auto_uploader.py).
; Firebase Console -> Configuración del proyecto -> Cuentas de servicio ->
; "Generar nueva clave privada".
; ATENCIÓN: esta clave da acceso total a tu proyecto (se salta las reglas de seguridad).
; Guárdala fuera del repositorio y no la compartas nunca.
; (variable de entorno: FIREBASE_SERVICE_ACCOUNT)
service_account_key =

; Bucket de Cloud Storage, sin "gs://" (Firebase Console -> Storage).
; Si lo dejas vacío se usa <id-del-proyecto>.firebasestorage.app
; (variable de entorno: FIREBASE_STORAGE_BUCKET)
storage_bucket =
